name: Test Claim Interlock pack download

on:
  push:
    branches:
      - herenow-claim-interlock-pack
    paths:
      - '.github/workflows/test-claim-pack-download.yml'

permissions:
  contents: write

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Google Drive download with gdown
        shell: bash
        run: |
          set -uo pipefail
          rm -rf herenow/download-test
          mkdir -p herenow/download-test
          python3 -m pip install --quiet gdown
          set +e
          gdown 'https://drive.google.com/uc?id=15xxmQdUia38ck3jiv8QKjUYX-6BsEF_b' -O herenow/download-test/payload.bin > herenow/download-test/gdown.log 2>&1
          STATUS=$?
          set -e
          SIZE=$(stat -c '%s' herenow/download-test/payload.bin 2>/dev/null || echo 0)
          MIME=$(file -b --mime-type herenow/download-test/payload.bin 2>/dev/null || echo unknown)
          SHA=$(sha256sum herenow/download-test/payload.bin 2>/dev/null | awk '{print $1}')
          {
            echo "status=$STATUS"
            echo "size=$SIZE"
            echo "mime=$MIME"
            echo "sha256=$SHA"
          } > herenow/download-test/result.txt
          tail -n 30 herenow/download-test/gdown.log > herenow/download-test/gdown_tail.txt || true
          head -c 16 herenow/download-test/payload.bin | xxd -p > herenow/download-test/head.hex || true
          rm -f herenow/download-test/payload.bin
      - name: Persist result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add herenow/download-test
          git commit -m 'test: record gdown result for Claim Interlock pack' || exit 0
          git push origin HEAD:herenow-claim-interlock-pack
