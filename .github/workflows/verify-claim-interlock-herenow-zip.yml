name: Verify Claim Interlock direct here.now ZIP

on:
  push:
    branches: [herenow-claim-interlock-pack]
    paths: ['.github/workflows/verify-claim-interlock-herenow-zip.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download direct here.now ZIP and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf herenow/direct-zip-verification
          mkdir -p herenow/direct-zip-verification
          python3 - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          base = Path('herenow/result/site_url.txt').read_text().strip().rstrip('/')
          url = base + '/Claim_Interlock_Product_Pack_v1.0.zip'
          req = urllib.request.Request(url, headers={'User-Agent':'Claim-Interlock-verifier/1.0'})
          with urllib.request.urlopen(req, timeout=240) as r:
              payload = r.read()
              status = getattr(r, 'status', None)
              content_type = r.headers.get('content-type')
              final_url = r.geturl()
          result = {
            'url': url,
            'final_url': final_url,
            'status': status,
            'content_type': content_type,
            'size': len(payload),
            'sha256': hashlib.sha256(payload).hexdigest(),
            'zip_magic': payload[:4].hex(),
            'verified': len(payload) == 13644242 and hashlib.sha256(payload).hexdigest() == 'e0f1f116ec3e5eee3b0ed7e7a6dd905d45e47115b9a8f7372cc09ca8ad7793f9' and payload.startswith(b'PK\x03\x04')
          }
          Path('herenow/direct-zip-verification/result.json').write_text(json.dumps(result, indent=2) + '\n')
          if not result['verified']:
              raise SystemExit('direct here.now ZIP verification failed: ' + json.dumps(result))
          PY
      - name: Persist verification receipt
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add herenow/direct-zip-verification/result.json
          git commit -m 'test: verify direct here.now product-pack ZIP' || exit 0
          git push origin HEAD:herenow-claim-interlock-pack
